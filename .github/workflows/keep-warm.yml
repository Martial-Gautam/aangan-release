# Render's free plan puts the engine to sleep after 15 idle minutes, and the
# first canvas load after that waits ~40 s. cron-job.org now keeps it awake:
# GET /healthz every 10 minutes, around the clock (744 h fits the 750 free
# hours with one free service). Render refuses to wake the engine for
# cron-job.org — an instant 503 — so the pings can only keep it awake, and an
# overnight gap let it sleep until someone opened the app.
#
# This used to run on a GitHub schedule, but GitHub throttles scheduled
# workflows: it fired 3–5 times a day against the 108 needed, mostly on a cold
# engine. Kept as a manual ping only.
name: keep the engine warm
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf --max-time 60 https://aangan-engine.onrender.com/healthz
